# name: 수업용 환경 이름입니다.
name: semi-ai
# channels: 도구를 가져올 저장소입니다.
channels:
  - conda-forge
  - nodefaults
# dependencies: 실습에 쓸 도구 목록입니다.
dependencies:
  - python=3.10
  - numpy=1.24.3
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - matplotlib=3.7.2
  - ipykernel=6.24.0
  - nbformat=5.9.1
  - nbclient=0.8.0
  - pip  # 아래 pip 설치 목록을 실행하는 도구입니다.
  - pip:
      - torch==2.0.1  # 신경망 실습 도구도 환경 생성·업데이트 때 함께 설치합니다.
